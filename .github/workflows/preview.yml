name: preview

on:
  push:
    branches:
      - preview
  pull_request:
    branches:
      - preview

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

  publish-preview:
    name: Publish Preview to NuGet
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest

    # id-token lets the job exchange a GitHub OIDC token for a short-lived NuGet key.
    # Naming any permission drops the rest to none, so contents is restated for checkout.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Generate preview version
        id: version
        run: |
          BASE_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' src/Blazorify.Flux.csproj)
          TIMESTAMP=$(date -u +"%y%m%d%H%M%S")
          echo "version=$BASE_VERSION-preview.$TIMESTAMP" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack --configuration Release --output ./artifacts /p:Version=${{ steps.version.outputs.version }}

      # The key is valid for an hour and single-use, so it is requested right before the push.
      - name: NuGet Login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

